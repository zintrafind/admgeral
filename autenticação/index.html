<!DOCTYPE html>
<html lang="pt-br">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Peça por Peça | Login & Cadastro Admin</title>
  <link rel="icon" type="image/x-icon" href="src/images/favicon.ico" />
  <link rel="stylesheet" href="src/styles/styles.css" />

  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" crossorigin="anonymous" referrerpolicy="no-referrer" />
</head>
<body>

    <div id="customPopup" class="custom-popup">
        <div class="popup-content">
            <h3 id="popupTitle">Aviso</h3>
            <p id="popupMessage">Mensagem aqui...</p>
            <button class="popup-btn" onclick="fecharPopup()">OK</button>
        </div>
    </div>

    <div class="container">
        <div class="form-box login">
            <form id="formLogin">
                <h1 class="title">Login</h1>
                <div class="input-box">
                    <input type="email" id="loginEmail" placeholder="Email do Administrador" required>
                    <i class="fa-solid fa-envelope"></i>
                </div>
                <div class="input-box">
                    <input type="password" id="loginPassword" placeholder="Senha do Administrador" required>
                    <i class="fa-solid fa-lock"></i>
                </div>

                <div class="remember-container">
                    <input type="checkbox" id="rememberMe">
                    <label for="rememberMe">Lembrar-me (Manter conectado)</label>
                </div>

                <button type="submit" class="btn">Login</button> 
            </form>
        </div>

        <div class="form-box register">
            <form id="formRegister">
                <h1 class="title">Cadastro</h1>
                <div class="input-box">
                    <input type="text" id="regName" placeholder="Nome do Administrador" required>
                    <i class="fa-solid fa-user"></i>
                </div>
                <div class="input-box">
                    <input type="email" id="regEmail" placeholder="Email do Administrador" required>
                    <i class="fa-solid fa-envelope"></i>
                </div>
                <div class="input-box">
                    <input type="password" id="regPassword" placeholder="Senha do Administrador" required>
                    <i class="fa-solid fa-lock"></i>
                </div>
                <button type="submit" class="btn register-btn">Cadastre-se</button>
            </form>
        </div>

        <div class="toggle-box">
            <div class="toggle-panel toggle-left">
                <h1 class="subtitle">Bem-Vindo de volta!</h1>
                <p>Não tem uma conta?</p>
                <button class="btn register-btn" type="button">Cadastre-se</button>
            </div>
            <div class="toggle-panel toggle-right">
                <h1>Olá Bem-Vindo!</h1>
                <p>Já tem uma conta?</p>
                <button class="btn login-btn" type="button">Login</button>
            </div>
        </div>
    </div>

<script>
    // Função de exibição do pop-up estilizado
    function mostrarPopup(titulo, mensagem, callback = null) {
        document.getElementById('popupTitle').innerText = titulo;
        document.getElementById('popupMessage').innerText = mensagem;
        document.getElementById('customPopup').style.display = 'flex';
        window.popupCallback = callback;
    }

    function fecharPopup() {
        document.getElementById('customPopup').style.display = 'none';
        if (window.popupCallback) {
            window.popupCallback();
            window.popupCallback = null;
        }
    }

    // --- 1. LÓGICA DE LOGIN COM A API & REMEMBER ME ---
    document.getElementById('formLogin').addEventListener('submit', async function(e) {
        e.preventDefault();

        const email = document.getElementById('loginEmail').value;
        const password = document.getElementById('loginPassword').value;
        const remember = document.getElementById('rememberMe').checked;

        try {
            const response = await fetch('http://127.0.0.1:8000/api/login', {
                method: 'POST',
                headers: { 
                    'Content-Type': 'application/json', 
                    'Accept': 'application/json' 
                },
                body: JSON.stringify({ email, password })
            });

            const data = await response.json();

            if (response.ok) {
                if (data.usuario.tp_usuario === 'A') {
                    // Se lembrar-me marcado, usa localStorage (salvo permanentemente). Senão, sessionStorage (apaga ao fechar aba).
                    if (remember) {
                        localStorage.setItem('adminToken', data.token);
                    } else {
                        sessionStorage.setItem('adminToken', data.token);
                    }

                    mostrarPopup('Sucesso!', 'Login de Administrador efetuado com sucesso!', () => {
                        window.location.href = '../anuncios-publicados/index.html';
                    });
                } else {
                    mostrarPopup('Acesso Negado', 'Esta conta não possui privilégios de Administrador.');
                }
            } else {
                mostrarPopup('Erro', data.message || 'E-mail ou senha incorretos.');
            }
        } catch (error) {
            console.error('Erro na conexão:', error);
            mostrarPopup('Erro de Conexão', 'Não foi possível conectar com a API do Laravel. Verifique se o servidor está rodando.');
        }
    });

    // --- 2. LÓGICA DE CADASTRO COM A API ---
    document.getElementById('formRegister').addEventListener('submit', async function(e) {
        e.preventDefault();

        const name = document.getElementById('regName').value;
        const email = document.getElementById('regEmail').value;
        const password = document.getElementById('regPassword').value;

        try {
            const response = await fetch('http://127.0.0.1:8000/api/users', {
                method: 'POST',
                headers: { 
                    'Content-Type': 'application/json', 
                    'Accept': 'application/json' 
                },
                body: JSON.stringify({ 
                    nm_usuario: name, 
                    email: email, 
                    password: password,
                    tp_usuario: 'A' 
                })
            });

            const data = await response.json();

            if (!response.ok) {
                console.error("Erro retornado pelo back-end:", data);
                mostrarPopup('Erro no Cadastro', data.message || 'Verifique os dados informados.');
                return;
            }

            mostrarPopup('Sucesso!', 'Administrador cadastrado com sucesso! Faça o login agora.', () => {
                location.reload(); 
            });

        } catch (error) {
            console.error('Erro crítico no cadastro:', error);
            mostrarPopup('Erro', 'Falha de comunicação com a API.');
        }
    });
</script>

<script src="src/javascript/script.js"></script>

</body>
</html>
